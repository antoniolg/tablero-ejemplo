<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Tablero</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Tablero">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/panels.css">
  <link rel="stylesheet" href="/home.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <nav class="rail" aria-label="Paneles">
    <div class="rail-tabs" role="tablist">
    <button type="button" role="tab" id="tab-inicio" aria-controls="panel-inicio" data-panel="inicio" title="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg><span>Inicio</span></button>
    <button type="button" role="tab" id="tab-tareas" aria-controls="panel-tareas" data-panel="tareas" title="Tareas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Tareas</span></button>
    <button type="button" role="tab" id="tab-calendario" aria-controls="panel-calendario" data-panel="calendario" title="Calendario"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Calendario</span></button>
    <button type="button" role="tab" id="tab-comidas" aria-controls="panel-comidas" data-panel="comidas" title="Comidas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 10v11M17 21V3c-2 1-3.5 3.5-3.5 7 0 1.5 1 2.5 3.5 2.5"/></svg><span>Comidas</span></button>
    </div>
    <button type="button" class="voice" id="voice" aria-label="Hablar al tablero" aria-pressed="false" title="Hablar al tablero: toca, habla y vuelve a tocar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
    <button type="button" class="theme" id="theme" aria-label="Modo oscuro" aria-pressed="false" title="Pasar a modo oscuro"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
    <p class="clock" id="clock"><strong></strong><span></span></p>
  </nav>

  <div class="main">
  <section class="panel" id="panel-inicio" role="tabpanel" aria-labelledby="tab-inicio" hidden>
    <div class="home" id="home"></div>
  </section>

  <section class="panel" id="panel-tareas" role="tabpanel" aria-labelledby="tab-tareas" hidden>
    <nav class="jump" id="jump" aria-label="Columnas"></nav>
    <main class="board" id="board"></main>
    <button type="button" id="new-card" class="fab" aria-label="Nueva tarea" title="Nueva tarea"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <section class="panel" id="panel-calendario" role="tabpanel" aria-labelledby="tab-calendario" hidden>
    <nav class="day-pills" id="cal-days" aria-label="Días"></nav>
    <div class="calendar" id="calendar"></div>
  </section>

  <section class="panel" id="panel-comidas" role="tabpanel" aria-labelledby="tab-comidas" hidden>
    <div class="toolbar">
      <div class="nav-week">
        <button type="button" class="nav" id="meals-prev" aria-label="Semana anterior">‹</button>
        <button type="button" id="meals-today">Esta semana</button>
        <button type="button" class="nav" id="meals-next" aria-label="Semana siguiente">›</button>
      </div>
      <h2 class="range" id="meals-range"></h2>
    </div>
    <div class="meals" id="meals"></div>
  </section>

  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <dialog id="detail" class="sheet" aria-label="Detalle"></dialog>
  <dialog id="ask" class="sheet small" aria-label="Confirmar"></dialog>
</body>
</html>
